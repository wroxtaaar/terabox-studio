services:
  - type: web
    name: terabox-bot
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: APP_URL
        sync: false
      - key: TERABOX_COOKIE_HEADER
        sync: false
      - key: DATA_DIR
        value: /app/data
      - key: MAX_QUEUE_SIZE
        value: "100"